# Local test dependencies for the automation platform.
# Usage: docker compose -f docker/docker-compose.yml up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-automation}
      MYSQL_USER: ${MYSQL_USER:-tester}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testerpw}
    ports:
      - "3306:3306"
    volumes:
      # Bind to the repository so Docker Desktop reinstalls do not remove data.
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: automation-platform-backend:latest
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: mysql+aiomysql://tester:testerpw@mysql:3306/automation
      APP_CORS_ORIGINS: "http://10.66.67.26:8080,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
      APP_ENV: production
    ports:
      - "8900:8900"
    volumes:
      # 同事推到 gitlab 的代码会先 pull 到本地, 后端容器要能看到才能跑测试
      - ../projects:/app/projects:ro
      # 测试报告输出
      - ../allure-report:/app/allure-report
      - ../data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: automation-platform-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  kafka_data:
