[project]
name = "framework"
version = "0.1.0"
description = "Shared automation testing framework core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "aiokafka>=0.11",
    "jsonschema>=4.0",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framework"]

[tool.hatch.build.targets.sdist]
include = ["src/framework"]