[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# For concurrent execution, run: pytest -n auto  (requires pytest-xdist)
markers =
    smoke: critical-path tests run on every commit (fast gate).
    regression: comprehensive tests run in the regression stage.