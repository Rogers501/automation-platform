# Ruff configuration (moved from pyproject.toml for an explicit tool layout).
line-length = 100
target-version = "py312"
src = ["framework/src", "tests"]
extend-exclude = ["reports", "logs", ".venv", ".venv-docx", ".docx-build", ".pytest-basetemp", ".pytest-tmp"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[format]
quote-style = "double"
indent-style = "space"
